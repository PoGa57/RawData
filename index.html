<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafico Finanziario - Dati CSV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.0/papaparse.min.js"></script>
    <style>
        body {
            background-color: #0c0e16;
            color: #e6e6e6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 1400px;
            margin-top: 20px;
        }
        .header-section {
            background: linear-gradient(135deg, #1a1c29 0%, #0c0e16 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .chart-container {
            background: linear-gradient(135deg, #1a1c29 0%, #0c0e16 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .info-panel {
            background: linear-gradient(135deg, #1a1c29 0%, #0c0e16 100%);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .price-info {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .change-positive {
            color: #16a34a;
        }
        .change-negative {
            color: #dc2626;
        }
        .volume-info {
            background-color: #1e293b;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: #94a3b8;
        }
        .error {
            background-color: #dc2626;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
        .time-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .time-btn {
            background-color: #1e293b;
            color: #e6e6e6;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .time-btn:hover, .time-btn.active {
            background-color: #334155;
            border-color: #64748b;
        }
        .indicators {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .indicator {
            background-color: #1e293b;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        .url-input {
            background-color: #1e293b;
            color: #e6e6e6;
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 5px;
            width: 100%;
            margin: 10px 0;
        }
        .btn-load {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-load:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-section">
            <h1 class="mb-3">📊 Analisi Finanziaria</h1>
            <p class="text-muted">Grafico basato sui dati del file CSV</p>
            
            <div class="mt-3">
                <label class="form-label"><strong>URL del file CSV:</strong></label>
                <input type="text" id="csvUrlInput" class="url-input" 
                    value="https://raw.githubusercontent.com/PoGa57/RawData/main/File_01.csv"
                    placeholder="Inserisci l'URL completo del tuo file CSV">
                <button class="btn-load" onclick="loadCustomCSV()">Carica Dati</button>
                <small class="text-muted d-block mt-2">
                    Usa un URL GitHub raw o carica un file CSV locale
                </small>
            </div>
        </div>

        <div class="info-panel">
            <div class="row">
                <div class="col-md-6">
                    <div class="price-info">
                        <span id="currentPrice">--</span>
                        <span id="priceChange" class="ms-2">--</span>
                    </div>
                    <div class="text-muted mt-2">
                        <span id="symbolInfo">Inserisci l'URL del CSV e clicca "Carica Dati"</span>
                    </div>
                </div>
                <div class="col-md-6 text-md-end">
                    <div class="volume-info">
                        <strong>Volume:</strong> <span id="volume">--</span>
                    </div>
                </div>
            </div>
            
            <div class="time-controls mt-3">
                <button class="time-btn active" data-range="1d">1D</button>
                <button class="time-btn" data-range="5d">5D</button>
                <button class="time-btn" data-range="1m">1M</button>
                <button class="time-btn" data-range="3m">3M</button>
                <button class="time-btn" data-range="6m">6M</button>
                <button class="time-btn" data-range="1y">1Y</button>
                <button class="time-btn" data-range="max">MAX</button>
            </div>
            
            <div class="indicators">
                <div class="indicator">MA(50): <span id="ma50">--</span></div>
                <div class="indicator">MA(200): <span id="ma200">--</span></div>
                <div class="indicator">RSI(14): <span id="rsi">--</span></div>
                <div class="indicator">Volume Avg: <span id="volAvg">--</span></div>
            </div>
        </div>

        <div class="chart-container">
            <div id="chart" style="height: 500px;"></div>
            <div id="loading" class="loading">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3">Inserisci l'URL del file CSV e clicca "Carica Dati"</p>
            </div>
            <div id="error" class="error" style="display: none;"></div>
        </div>
    </div>

    <script>
        // Variabili globali
        let chart = null;
        let candleSeries = null;
        let volumeSeries = null;
        let allData = [];
        let currentData = [];

        // Inizializza il grafico
        function initChart() {
            const chartContainer = document.getElementById('chart');
            chart = LightweightCharts.createChart(chartContainer, {
                layout: {
                    backgroundColor: '#0c0e16',
                    textColor: '#e6e6e6',
                },
                grid: {
                    vertLines: {
                        color: '#1e293b',
                    },
                    horzLines: {
                        color: '#1e293b',
                    },
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                },
                priceScale: {
                    borderColor: '#334155',
                },
                timeScale: {
                    borderColor: '#334155',
                    timeVisible: true,
                    secondsVisible: false,
                },
                localization: {
                    locale: 'it-IT',
                    dateFormat: 'dd MMMM yyyy',
                },
            });

            // Serie candele
            candleSeries = chart.addCandlestickSeries({
                upColor: '#16a34a',
                downColor: '#dc2626',
                borderVisible: false,
                wickUpColor: '#16a34a',
                wickDownColor: '#dc2626',
            });

            // Serie volume
            volumeSeries = chart.addHistogramSeries({
                color: '#3b82f6',
                priceFormat: {
                    type: 'volume',
                },
                priceScaleId: '',
                scaleMargins: {
                    top: 0.8,
                    bottom: 0,
                },
            });

            // Eventi mouse
            chart.subscribeCrosshairMove(param => {
                if (param.time && param.seriesPrices.size > 0) {
                    const price = param.seriesPrices.get(candleSeries);
                    if (price) {
                        document.getElementById('currentPrice').textContent = price.close.toFixed(2);
                    }
                }
            });
        }

        // Carica dati CSV personalizzato
        function loadCustomCSV() {
            const csvUrl = document.getElementById('csvUrlInput').value.trim();
            
            if (!csvUrl) {
                showError('Per favore inserisci un URL valido');
                return;
            }

            // Mostra loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('symbolInfo').textContent = 'Caricamento dati...';

            // Usa proxy CORS per GitHub
            let proxyUrl = csvUrl;
            if (csvUrl.includes('github.com') || csvUrl.includes('raw.githubusercontent.com')) {
                proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(csvUrl);
            }

            Papa.parse(proxyUrl, {
                download: true,
                header: true,
                dynamicTyping: true,
                skipEmptyLines: true,
                complete: function(results) {
                    processData(results.data);
                },
                error: function(err) {
                    showError('Errore nel caricamento CSV: ' + err.message + 
                        '<br><small>Prova con un proxy CORS o carica il file localmente</small>');
                }
            });
        }

        // Processa i dati
        function processData(data) {
            try {
                console.log('Dati ricevuti:', data.length, 'righe');
                
                if (data.length === 0) {
                    throw new Error('Il file CSV è vuoto');
                }

                // Mostra le prime righe per debug
                console.log('Prima riga:', data[0]);

                // Filtra e trasforma i dati
                allData = data
                    .filter(row => {
                        // Verifica che ci siano tutte le colonne necessarie
                        return row.Date && row.Open !== undefined && row.High !== undefined && 
                               row.Low !== undefined && row.Close !== undefined;
                    })
                    .map(row => {
                        const timestamp = new Date(row.Date).getTime();
                        if (isNaN(timestamp)) {
                            console.warn('Data non valida:', row.Date);
                            return null;
                        }
                        return {
                            time: Math.floor(timestamp / 1000),
                            open: parseFloat(row.Open),
                            high: parseFloat(row.High),
                            low: parseFloat(row.Low),
                            close: parseFloat(row.Close),
                            volume: row.Volume ? parseInt(row.Volume) : 0
                        };
                    })
                    .filter(item => item !== null && !isNaN(item.open))
                    .sort((a, b) => a.time - b.time);

                console.log('Dati validi:', allData.length);

                if (allData.length === 0) {
                    throw new Error('Nessun dato valido trovato. Verifica il formato del CSV.');
                }

                // Mostra dati iniziali
                updateChartData('1m');
                updateInfoPanel();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('symbolInfo').textContent = 
                    `✅ Dati caricati: ${allData.length} record dal ${new Date(allData[0].time * 1000).toLocaleDateString()} al ${new Date(allData[allData.length-1].time * 1000).toLocaleDateString()}`;
                
            } catch (error) {
                console.error('Errore nel processamento:', error);
                showError('Errore nel processamento dei dati: ' + error.message + 
                    '<br><small>Verifica che il CSV abbia le colonne: Date,Open,High,Low,Close,Volume</small>');
            }
        }

        // Aggiorna il grafico con il range selezionato
        function updateChartData(range) {
            if (allData.length === 0) return;

            const now = new Date(allData[allData.length - 1].time * 1000);
            let startDate = new Date(now);
            
            switch(range) {
                case '1d': startDate.setDate(now.getDate() - 1); break;
                case '5d': startDate.setDate(now.getDate() - 5); break;
                case '1m': startDate.setMonth(now.getMonth() - 1); break;
                case '3m': startDate.setMonth(now.getMonth() - 3); break;
                case '6m': startDate.setMonth(now.getMonth() - 6); break;
                case '1y': startDate.setFullYear(now.getFullYear() - 1); break;
                case 'max': startDate = new Date(allData[0].time * 1000); break;
            }

            const startTime = Math.floor(startDate.getTime() / 1000);
            currentData = allData.filter(d => d.time >= startTime);

            if (currentData.length > 0) {
                candleSeries.setData(currentData);
                volumeSeries.setData(currentData.map(d => ({
                    time: d.time,
                    value: d.volume,
                    color: d.close > d.open ? '#16a34a' : '#dc2626'
                })));
                
                // Adatta la vista
                chart.timeScale().fitContent();
            } else {
                showError('Nessun dato nel range selezionato. Prova un range più ampio.');
            }
        }

        // Aggiorna il pannello informazioni
        function updateInfoPanel() {
            if (currentData.length === 0) return;

            const latest = currentData[currentData.length - 1];
            const previous = currentData.length > 1 ? currentData[currentData.length - 2] : latest;
            
            const priceChange = latest.close - previous.close;
            const priceChangePercent = (priceChange / previous.close) * 100;
            
            document.getElementById('currentPrice').textContent = latest.close.toFixed(2);
            document.getElementById('priceChange').textContent = 
                `${priceChange >= 0 ? '+' : ''}${priceChange.toFixed(2)} (${priceChangePercent.toFixed(2)}%)`;
            document.getElementById('priceChange').className = 
                `ms-2 ${priceChange >= 0 ? 'change-positive' : 'change-negative'}`;
            document.getElementById('volume').textContent = formatVolume(latest.volume);
            
            // Calcola indicatori
            updateIndicators();
        }

        // Calcola indicatori tecnici
        function updateIndicators() {
            if (currentData.length < 200) {
                document.getElementById('ma50').textContent = currentData.length < 50 ? 'N/A' : calculateMA(50).toFixed(2);
                document.getElementById('ma200').textContent = 'N/A';
                document.getElementById('rsi').textContent = currentData.length < 15 ? 'N/A' : calculateRSI(14).toFixed(2);
                document.getElementById('volAvg').textContent = calculateVolAvg(20);
                return;
            }

            // MA(50)
            const ma50 = calculateMA(50);
            document.getElementById('ma50').textContent = ma50.toFixed(2);

            // MA(200)
            const ma200 = calculateMA(200);
            document.getElementById('ma200').textContent = ma200.toFixed(2);

            // RSI(14)
            const rsi = calculateRSI(14);
            document.getElementById('rsi').textContent = rsi.toFixed(2);

            // Volume medio
            document.getElementById('volAvg').textContent = calculateVolAvg(20);
        }

        // Calcola media mobile
        function calculateMA(period) {
            if (currentData.length < period) return 0;
            const slice = currentData.slice(-period);
            return slice.reduce((sum, d) => sum + d.close, 0) / period;
        }

        // Calcola RSI
        function calculateRSI(period) {
            if (currentData.length < period + 1) return 0;
            
            const gains = [];
            const losses = [];
            
            for (let i = currentData.length - period; i < currentData.length; i++) {
                const diff = currentData[i].close - currentData[i - 1].close;
                if (diff > 0) gains.push(diff);
                else losses.push(Math.abs(diff));
            }
            
            const avgGain = gains.reduce((a, b) => a + b, 0) / period;
            const avgLoss = losses.reduce((a, b) => a + b, 0) / period;
            
            if (avgLoss === 0) return 100;
            const rs = avgGain / avgLoss;
            return 100 - (100 / (1 + rs));
        }

        // Calcola volume medio
        function calculateVolAvg(period) {
            if (currentData.length < period) period = currentData.length;
            const slice = currentData.slice(-period);
            const avg = slice.reduce((sum, d) => sum + d.volume, 0) / period;
            return formatVolume(avg);
        }

        // Formatta volume
        function formatVolume(volume) {
            if (volume >= 1e9) return (volume / 1e9).toFixed(2) + 'B';
            if (volume >= 1e6) return (volume / 1e6).toFixed(2) + 'M';
            if (volume >= 1e3) return (volume / 1e3).toFixed(2) + 'K';
            return volume.toString();
        }

        // Mostra errore
        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            const errorDiv = document.getElementById('error');
            errorDiv.innerHTML = message;
            errorDiv.style.display = 'block';
            // Auto-hide dopo 10 secondi
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 10000);
        }

        // Inizializzazione
        document.addEventListener('DOMContentLoaded', function() {
            initChart();
            
            // Gestione pulsanti time range
            document.querySelectorAll('.time-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    if (allData.length === 0) {
                        showError('Carica prima i dati CSV!');
                        return;
                    }
                    document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    updateChartData(this.dataset.range);
                });
            });
            
            // Carica CSV al pressione di Enter
            document.getElementById('csvUrlInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    loadCustomCSV();
                }
            });
        });
    </script>
</body>
</html>
